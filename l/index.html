<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF7F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173A5E'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23E2A62A' font-style='italic'%3EGJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/wb.css">
<style>html,body{margin:0;height:100%;background:#E9E1D3}#book{max-width:480px;height:100vh;height:100dvh;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}
.nf{max-width:420px;margin:0 auto;padding:80px 24px;font:400 17px/1.6 Karla,Arial,sans-serif;color:#2C2A27;text-align:center}.nf b{display:block;font:500 34px/1.1 'Cormorant Garamond',Georgia,serif;color:#173A5E;margin-bottom:12px}</style>
</head>
<body>
<div id="book"></div>
<script src="../assets/qrcode.js"></script>
<script src="../assets/wb.js"></script>
<script>
(function(){
  var c=(new URLSearchParams(location.search).get('c')||'').replace(/[^a-z0-9-]/g,''), el=document.getElementById('book');
  function nf(){el.innerHTML='<div class="nf"><b>Welcome book</b>Ce livret n\u2019est pas encore en ligne. · This welcome book is not online yet. · Questo welcome book non \u00e8 ancora online.</div>'}
  if(!c)return nf();
  fetch('data/'+c+'.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    document.title=(d.name||'Welcome book')+' \u00b7 Welcome book';document.documentElement.lang=d.lang||'fr';
    WB.render(d,el,{img:'../img/'});
  }).catch(nf);
})();
</script>
</body>
</html>
