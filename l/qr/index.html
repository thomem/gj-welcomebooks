<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR code</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF7F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173A5E'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23E2A62A' font-style='italic'%3EGJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../assets/wb.css">
<style>body{margin:0;background:#E9E1D3;font:400 16px/1.5 Karla,Arial,sans-serif;color:#2C2A27}
.w{max-width:560px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
canvas{width:100%;max-width:480px;height:auto;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.12);background:#FBF7F0}
.b{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.b a,.b button{font:700 15px Karla,Arial;border:0;border-radius:999px;padding:13px 20px;background:#173A5E;color:#FBF7F0;cursor:pointer;text-decoration:none}
.b .g{background:#E2A62A;color:#0F2742}code{background:#fff;padding:4px 8px;border-radius:8px;word-break:break-all;font-size:14px}
@media print{.b,p{display:none}body{background:#fff}canvas{box-shadow:none;max-width:none;width:12cm}}</style>
</head>
<body>
<div class="w">
<canvas id="cv" width="1200" height="1500"></canvas>
<p><code id="u"></code></p>
<div class="b"><button type="button" class="g" id="png">Télécharger le PNG</button><button type="button" onclick="print()">Imprimer</button><a id="open" target="_blank" rel="noopener">Ouvrir le livret</a></div>
</div>
<script src="../../assets/qrcode.js"></script>
<script>
(function(){
  var c=(new URLSearchParams(location.search).get('c')||'').replace(/[^a-z0-9-]/g,'');
  var url=location.origin+location.pathname.replace(/qr\/(index\.html)?$/,'')+'?c='+c;
  document.getElementById('u').textContent=url;document.getElementById('open').href=url;
  var TH={sicile:'#173A5E',provence:'#4A3C6B',lisbonne:'#16306B',amalfi:'#13606A',cyclades:'#163F78',marrakech:'#173E37'};
  function draw(name,col){
    var cv=document.getElementById('cv'),x=cv.getContext('2d');
    x.fillStyle='#FBF7F0';x.fillRect(0,0,1200,1500);
    x.fillStyle='#fff';x.strokeStyle='#E4D7C2';x.lineWidth=4;
    if(x.roundRect){x.beginPath();x.roundRect(150,300,900,900,40);x.fill();x.stroke()}else{x.fillRect(150,300,900,900)}
    var q=qrcode(0,'M');q.addData(url);q.make();var n=q.getModuleCount(),s=Math.floor(820/(n+2)),o=600-s*n/2;
    x.fillStyle=col;for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(o+k*s,750-s*n/2+r*s,s,s);
    x.textAlign='center';x.fillStyle=col;x.font='600 92px "Cormorant Garamond", Georgia, serif';x.fillText(name,600,180);
    x.fillStyle='#625D55';x.font='30px Karla, Arial';x.fillText("Livret d\u2019accueil \u00b7 Welcome book \u00b7 Benvenuti",600,248);
    x.fillStyle=col;x.font='bold 40px Karla, Arial';x.fillText("Scannez avec l\u2019appareil photo",600,1300);
    x.fillStyle='#625D55';x.font='30px Karla, Arial';x.fillText('Scan with your camera \u00b7 Inquadra con la fotocamera',600,1355);
    for(var i=0;i<1200;i+=40){x.fillStyle=(i/40)%2?'#C46F48':'#E2A62A';x.beginPath();x.moveTo(i,1500);x.lineTo(i+20,1470);x.lineTo(i+40,1500);x.fill()}
  }
  function go(d){document.fonts&&document.fonts.ready.then(function(){draw(d.name||'Welcome',TH[d.style]||'#173A5E')});draw(d.name||'Welcome',TH[d.style]||'#173A5E')}
  fetch('../data/'+c+'.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(go).catch(function(){go({})});
  document.getElementById('png').onclick=function(){var a=document.createElement('a');a.download='qr-code-'+c+'.png';a.href=document.getElementById('cv').toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()};
})();
</script>
</body>
</html>
